<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | VU Study Support</title><link rel="stylesheet" href="/static/site.css"><style>body{background:#f5f7fb}.admin{max-width:1200px;margin:40px auto;padding:0 20px}.panel{background:white;border:1px solid #e3e8f1;border-radius:16px;padding:25px;margin:20px 0}.admin-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.admin h1{font-size:32px;color:#142744;letter-spacing:-1px}.admin input,.admin textarea,.admin select{width:100%;padding:12px;border:1px solid #dce3ed;border-radius:8px;margin:6px 0 15px}.admin label{display:block;font-size:13px;font-weight:650}.admin button{background:#3159ef;color:white;border:0;border-radius:8px;padding:11px 15px}.admin button.danger{background:#ad3047}.admin button.light{background:#e8edff;color:#17337e}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.active{background:#071327}.entry{border-top:1px solid #e4e8ef;padding:15px 0;display:flex;align-items:center;justify-content:space-between;gap:15px}.entry strong{display:block}.entry small{display:block;color:#63738a;margin-top:4px}.entry-actions{display:flex;gap:7px}.editor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.editor .full{grid-column:1/-1}.hidden{display:none!important}.status{font-size:13px;color:#3159ef}.inquiry{display:grid;grid-template-columns:1fr auto;gap:12px;border-top:1px solid #e3e8f1;padding:15px 0}.inquiry p{margin:8px 0;font-size:14px}.inquiry select{max-width:150px}@media(max-width:650px){.editor,.inquiry{grid-template-columns:1fr}.entry{align-items:flex-start;flex-direction:column}.admin{margin-top:20px}}</style></head><body><div class="admin"><div class="admin-header"><div><a href="/">← Back to website</a><h1>Management dashboard</h1></div><button id="logout" class="light hidden">Log out</button></div><section id="login-box" class="panel" style="max-width:420px"><h2>Secure sign in</h2><form id="login-form"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><p id="login-status" role="status"></p></section><div id="dashboard" class="hidden"><div class="tabs panel" id="tabs"></div><div class="panel"><div class="admin-header"><h2 id="section-title"></h2><button id="new-item">+ Add new</button></div><div id="records"></div><form id="editor" class="editor hidden"></form><p class="status" id="status" role="status"></p></div></div></div><script src="/static/admin.js" defer></script></body></html>
